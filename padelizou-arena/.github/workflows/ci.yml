name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSAO: 4.7.2

jobs:
  core:
    name: Core — build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Padel.Core.Tests/Padel.Core.Tests.csproj -c Release --nologo

  godot:
    name: Godot — compila e roda 15 s sem tela
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # O SDK Godot.NET.Sdk vem do NuGet, então o projeto compila sem o editor.
      - run: dotnet build Padel.Godot/Padel.Godot.csproj -c Debug --nologo
      # O editor headless valida a cena e roda uma partida IA x IA — o mesmo que se roda na máquina de desenvolvimento.
      - name: Baixar Godot ${{ env.GODOT_VERSAO }} (.NET)
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSAO}-stable/Godot_v${GODOT_VERSAO}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSAO}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSAO}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Importar e rodar
        working-directory: Padel.Godot
        run: |
          "$GODOT" --headless --path . --import
          ../ferramentas/rodar_sem_tela.sh "$GODOT" --auto --semente 42 --sair-apos 15
      - name: Conferência da interface (linha de comando, configuração, placar, controle)
        working-directory: Padel.Godot
        run: '"$GODOT" --headless --path . res://cenas/TestePlacar.tscn -- --conferir'
      - name: Salas impossíveis (porta ocupada, endereço que não resolve, host ausente, recusa)
        run: ferramentas/conferir_salas_impossiveis.sh "$GODOT"
      - name: Conferência da rede (ENet de verdade em 127.0.0.1)
        working-directory: Padel.Godot
        run: '"$GODOT" --headless --path . res://cenas/TesteRede.tscn -- --conferir'
      - name: Sons — o gerador confere taxa, bits, pico, DC e o loop do ambiente
        run: python3 ferramentas/teste_sintetizar_sons.py
      - name: Sons — TesteSom (todo golpe do Core tem som, posição, altura, sorteio, prioridade, volume)
        working-directory: Padel.Godot
        run: '"$GODOT" --headless --audio-driver Dummy --path . res://cenas/TesteSom.tscn'

  exportar:
    name: Exportar builds (Linux e Windows)
    runs-on: ubuntu-latest
    needs: godot
    # Os templates são 1,2 GB: só exporta no main, em tag, ou quando pedido na mão (Actions → CI → Run workflow).
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Cache dos templates de exportação
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSAO }}.stable.mono
          key: godot-templates-mono-${{ env.GODOT_VERSAO }}
      - name: Baixar templates (só Linux e Windows x86_64)
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          D=~/.local/share/godot/export_templates/${GODOT_VERSAO}.stable.mono
          mkdir -p "$D"
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSAO}-stable/Godot_v${GODOT_VERSAO}-stable_mono_export_templates.tpz"
          unzip -q -o -j templates.tpz templates/linux_debug.x86_64 templates/linux_release.x86_64 templates/windows_debug_x86_64.exe templates/windows_release_x86_64.exe templates/windows_debug_x86_64_console.exe templates/windows_release_x86_64_console.exe templates/version.txt templates/icudt_godot.dat -d "$D"
      - name: Baixar Godot ${{ env.GODOT_VERSAO }} (.NET)
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSAO}-stable/Godot_v${GODOT_VERSAO}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSAO}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSAO}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Exportar
        working-directory: Padel.Godot
        run: |
          mkdir -p ../build/linux ../build/windows
          "$GODOT" --headless --path . --import
          "$GODOT" --headless --path . --export-release "Linux" ../build/linux/PadelizouArena.x86_64
          "$GODOT" --headless --path . --export-release "Windows" ../build/windows/PadelizouArena.exe
      - name: O build Linux exportado roda sozinho
        working-directory: build/linux
        run: |
          ./PadelizouArena.x86_64 --headless -- --auto --semente 42 --sair-apos 10 2>&1 | tee saida.txt
          grep -q "Saindo após" saida.txt
          ! grep -qE "leaked at exit|still in use at exit" saida.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PadelizouArena-linux
          path: build/linux
      - uses: actions/upload-artifact@v4
        with:
          name: PadelizouArena-windows
          path: build/windows
