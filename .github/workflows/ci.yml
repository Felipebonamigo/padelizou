# CI do Padelizou — roda os testes automatizados a cada push e pull request.
# Se algum teste falhar, o commit fica marcado com ❌ no GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # ⚠️ GATILHO MANUAL — existe por causa de 26/08/2026, e não por gosto de botão.
  #
  # Naquele dia o GitHub parou de gerar os eventos de `push`/`pull_request` deste repo das
  # ~13:05Z às ~16:06Z. O PR #41 ficou 3 horas sem um único check criado (nem vermelho: NENHUM),
  # e o merge dele em `main` caiu no último minuto da janela — o push não disparou, então o
  # `build-N-sha7` daquele commit NUNCA foi publicado e não havia o que instalar em produção.
  #
  # Sem `workflow_dispatch` não havia saída: as duas gambiarras óbvias (commit vazio, fechar e
  # reabrir o PR) são justamente as que não se deve usar pra forçar CI, e o `ci.yml` não tinha
  # como ser chamado na mão. Agora tem: Actions → CI → Run workflow, escolhendo o branch.
  workflow_dispatch:

jobs:
  testes:
    # Sem o número de testes no nome: ele envelhece a cada teste novo (nasceu "85",
    # hoje são 668) e ninguém lembra de vir mudar aqui. A contagem real sai no log.
    name: Build + testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar pacotes
        run: dotnet restore Padelizou.slnx

      - name: Compilar (Release)
        run: dotnet build Padelizou.slnx -c Release --no-restore

      # STATUS.md de 07/08/2026: um snapshot em desacordo com o modelo compila e passa pela
      # suíte (que usa banco em memória) — só estoura no Migrate() do startup, em produção. A
      # regra "conferir com has-pending-model-changes antes de commitar" morava só na memória
      # do projeto; agora falha o build se alguém esquecer. Não precisa de banco: compara o
      # modelo COMPILADO contra o snapshot commitado.
      - name: Conferir migration pendente (modelo x snapshot)
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations has-pending-model-changes \
            --project Padelizou/Padelizou.csproj --startup-project Padelizou/Padelizou.csproj \
            --configuration Release

      - name: Rodar os testes
        # O relatório .trx existe só pro passo seguinte. Sem cano (`| tee`) de propósito:
        # com cano, quem devolve o código de saída é o tee, e uma suíte VERMELHA passaria
        # por verde — liberando deploy de código que não passou nos testes.
        run: dotnet test Padelizou.slnx -c Release --no-build --nologo --logger "trx;LogFileName=resultado.trx"

      - name: Dizer QUAL teste caiu
        # O log completo do CI só se lê autenticado (a API devolve 403 sem token). Em
        # 01/08/2026 a suíte reprovou três vezes seguidas em commits de código idêntico e
        # não deu pra saber o que quebrou sem alguém abrir a aba Actions no navegador.
        #
        # `::error::` vira ANOTAÇÃO, e anotação é pública: o nome do teste passa a estar ao
        # alcance de quem só tem o sha. Este passo nunca muda o resultado do job — o job já
        # está vermelho pelo passo anterior, e o `exit 0` daqui não desfaz isso.
        if: failure()
        shell: bash
        run: |
          relatorio=$(find . -name resultado.trx | head -1)
          if [ -z "$relatorio" ]; then
            echo "::error::Os testes falharam antes de gerar o relatorio (erro de compilacao ou de ambiente)."
            exit 0
          fi
          quebrados=$(grep -oE 'testName="[^"]+"[^>]*outcome="Failed"' "$relatorio" \
                      | grep -oE 'testName="[^"]+"' | sed 's/testName="//;s/"$//' | sort -u)
          if [ -z "$quebrados" ]; then
            echo "::error::A suite falhou mas nenhum teste aparece como Failed no relatorio."
            exit 0
          fi
          echo "$quebrados" | while IFS= read -r teste; do echo "::error::TESTE VERMELHO: $teste"; done
          exit 0

      # Este passo vem DEPOIS do "Dizer QUAL teste caiu", e a ordem importa: aquele roda em
      # `if: failure()`, então um portão de CVE antes dele faria o job anunciar "a suíte falhou
      # mas nenhum teste aparece como Failed" — mensagem falsa pra uma falha que não é de teste.
      # Aqui no fim: suíte vermelha para o job antes daqui, e suíte verde deixa este rodar.
      # Auditoria de supply chain de 21/08/2026. O audit do NuGet já vinha LIGADO e bem
      # configurado — NuGetAudit=true, NuGetAuditMode=all (cobre as transitivas),
      # NuGetAuditLevel=low — só que ele sai como WARNING no meio do log do restore, e
      # ninguém lê log de restore. Uma CVE nova em qualquer um dos pacotes entrava em
      # produção sem nada ficar vermelho.
      #
      # É a mesma história do passo de migration pendente aqui em cima: a regra morava na
      # memória do projeto até virar falha de build.
      #
      # A leitura é do JSON, e não do texto da tabela: texto de ferramenta muda de forma
      # entre versões do SDK, e um grep que para de casar vira um portão que aprova tudo
      # calado — pior que portão nenhum.
      #
      # ⚠️ Se um dia isto travar por um advisory que não te alcança (transitiva de teste,
      # caminho de código que você não usa), a saída NÃO é apagar o passo: é
      # <NuGetAuditSuppress Include="https://github.com/advisories/GHSA-..." /> no .csproj,
      # com um comentário dizendo POR QUE aquele não alcança. Suprimir um é uma decisão;
      # desligar o portão é perder o aviso de todos.
      - name: Conferir vulnerabilidade nos pacotes
        shell: bash
        run: |
          dotnet list Padelizou.slnx package --vulnerable --include-transitive \
            --format json > "${RUNNER_TEMP:-/tmp}/vulneraveis.json"
          python3 - <<'FIM'
          import json, os, sys

          relatorio = json.load(open(os.environ.get("RUNNER_TEMP", "/tmp") + "/vulneraveis.json"))

          # Restore quebrado devolve {"problems": [...]} e NENHUM "projects". Ler isso como
          # "zero vulnerabilidade" e seguir verde e a falha silenciosa classica de portao:
          # o dia em que ele parar de funcionar, ele APROVA tudo em vez de avisar. Aconteceu
          # ao testar este proprio passo, antes de commitar.
          problemas = [x for x in relatorio.get("problems") or [] if x.get("level") == "error"]
          if problemas or "projects" not in relatorio:
              for x in problemas:
                  print(f'::error::Nao deu pra auditar os pacotes: {x.get("text")}')
              if not problemas:
                  print("::error::A auditoria nao devolveu lista de projetos — resultado nao confiavel.")
              sys.exit(1)

          achados = []
          for projeto in relatorio.get("projects", []):
              nome = projeto["path"].split("/")[-1]
              for fw in projeto.get("frameworks") or []:
                  for chave in ("topLevelPackages", "transitivePackages"):
                      for pacote in fw.get(chave) or []:
                          for v in pacote.get("vulnerabilities") or []:
                              achados.append(
                                  f'{pacote["id"]} {pacote["resolvedVersion"]} ({nome}, '
                                  f'{"direta" if chave == "topLevelPackages" else "transitiva"}) '
                                  f'— {v["severity"]} — {v["advisoryurl"]}')

          # ::error:: vira ANOTACAO, que se le sem abrir o log inteiro — mesma razao do
          # passo que diz qual teste caiu: dá pra entender a falha pelo celular.
          for a in achados:
              print(f"::error::PACOTE VULNERAVEL: {a}")

          print(f"{len(achados)} vulnerabilidade(s) conhecida(s) na arvore.")
          sys.exit(1 if achados else 0)
          FIM

  # Se os testes passaram no main, gera o pacote pronto pra deploy e anexa
  # num release "build-N-sha". O VPS só instala pacotes daqui — ou seja,
  # é impossível publicar código que não passou nos testes.
  #
  # ⚠️ O `workflow_dispatch` ENTRA AQUI JUNTO COM O `push`, e sem isso o gatilho manual não
  # serviria pro caso que o criou (26/08/2026): rodar só os testes na mão não resolve nada
  # quando o problema é que o push do merge não gerou PACOTE. Foi exatamente o que travou o
  # `60ddcef` — mergeado em `main`, testes verdes, e sem release nenhum pra instalar.
  #
  # `needs: testes` continua valendo pro disparo manual: o pacote nasce do job de testes,
  # então continua sendo impossível publicar código que não passou na suíte.
  publicar:
    name: Pacote de deploy
    needs: testes
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # -r linux-x64: sem isso o publish leva binario nativo do SkiaSharp pra 18
      # plataformas — Windows x86/x64/arm64, macOS, riscv64, loongarch64, Android — e o VPS
      # roda UMA. Eram 427 MB dos 493 MB do pacote em blob nativo que aquele servidor nunca
      # vai executar: codigo que roda direto, nao e IL, e nenhuma ferramenta do .NET
      # inspeciona. Com o RID o pacote cai pra 66 MB e o tar.gz pra 24 MB.
      #
      # --self-contained false mantem o deploy como sempre foi: o .NET vem do servidor, o
      # pacote leva so o app. O systemd continua subindo com `dotnet Padelizou.dll`, e o
      # libSkiaSharp.so passa a ficar na raiz do pacote em vez de runtimes/linux-x64/native
      # — que e onde o host do .NET procura primeiro.
      - name: Publicar (Release)
        run: |
          dotnet publish Padelizou/Padelizou.csproj -c Release \
            -r linux-x64 --self-contained false -o publish

      - name: Compactar
        run: tar -czf padelizou.tar.gz -C publish .

      - name: Criar release de build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha7=$(echo "${{ github.sha }}" | cut -c1-7)
          tag="build-${{ github.run_number }}-$sha7"
          gh release create "$tag" padelizou.tar.gz \
            --title "Build ${{ github.run_number }} ($sha7)" \
            --notes "Pacote pronto pra deploy — commit ${{ github.sha }}" \
            --prerelease

      - name: Limpar builds antigos (mantém os 20 últimos)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName -q '.[].tagName' \
            | grep '^build-' | sort -t- -k2 -rn | tail -n +21 \
            | xargs -r -I{} gh release delete {} --cleanup-tag --yes
