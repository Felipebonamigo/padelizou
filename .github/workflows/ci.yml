# CI do Padelizou — roda os testes automatizados a cada push e pull request.
# Se algum teste falhar, o commit fica marcado com ❌ no GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    # Sem o número de testes no nome: ele envelhece a cada teste novo (nasceu "85",
    # hoje são 668) e ninguém lembra de vir mudar aqui. A contagem real sai no log.
    name: Build + testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar pacotes
        run: dotnet restore Padelizou.slnx

      - name: Compilar (Release)
        run: dotnet build Padelizou.slnx -c Release --no-restore

      - name: Rodar os testes
        # O relatório .trx existe só pro passo seguinte. Sem cano (`| tee`) de propósito:
        # com cano, quem devolve o código de saída é o tee, e uma suíte VERMELHA passaria
        # por verde — liberando deploy de código que não passou nos testes.
        run: dotnet test Padelizou.slnx -c Release --no-build --nologo --logger "trx;LogFileName=resultado.trx"

      - name: Dizer QUAL teste caiu
        # O log completo do CI só se lê autenticado (a API devolve 403 sem token). Em
        # 01/08/2026 a suíte reprovou três vezes seguidas em commits de código idêntico e
        # não deu pra saber o que quebrou sem alguém abrir a aba Actions no navegador.
        #
        # `::error::` vira ANOTAÇÃO, e anotação é pública: o nome do teste passa a estar ao
        # alcance de quem só tem o sha. Este passo nunca muda o resultado do job — o job já
        # está vermelho pelo passo anterior, e o `exit 0` daqui não desfaz isso.
        if: failure()
        shell: bash
        run: |
          relatorio=$(find . -name resultado.trx | head -1)
          if [ -z "$relatorio" ]; then
            echo "::error::Os testes falharam antes de gerar o relatorio (erro de compilacao ou de ambiente)."
            exit 0
          fi
          quebrados=$(grep -oE 'testName="[^"]+"[^>]*outcome="Failed"' "$relatorio" \
                      | grep -oE 'testName="[^"]+"' | sed 's/testName="//;s/"$//' | sort -u)
          if [ -z "$quebrados" ]; then
            echo "::error::A suite falhou mas nenhum teste aparece como Failed no relatorio."
            exit 0
          fi
          echo "$quebrados" | while IFS= read -r teste; do echo "::error::TESTE VERMELHO: $teste"; done
          exit 0

  # Se os testes passaram no main, gera o pacote pronto pra deploy e anexa
  # num release "build-N-sha". O VPS só instala pacotes daqui — ou seja,
  # é impossível publicar código que não passou nos testes.
  publicar:
    name: Pacote de deploy
    needs: testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publicar (Release)
        run: dotnet publish Padelizou/Padelizou.csproj -c Release -o publish

      - name: Compactar
        run: tar -czf padelizou.tar.gz -C publish .

      - name: Criar release de build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha7=$(echo "${{ github.sha }}" | cut -c1-7)
          tag="build-${{ github.run_number }}-$sha7"
          gh release create "$tag" padelizou.tar.gz \
            --title "Build ${{ github.run_number }} ($sha7)" \
            --notes "Pacote pronto pra deploy — commit ${{ github.sha }}" \
            --prerelease

      - name: Limpar builds antigos (mantém os 20 últimos)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName -q '.[].tagName' \
            | grep '^build-' | sort -t- -k2 -rn | tail -n +21 \
            | xargs -r -I{} gh release delete {} --cleanup-tag --yes
