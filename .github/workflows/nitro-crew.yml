# CI do Nitro Crew (o jogo em nitro-crew/). Separado do ci.yml do Padelizou de propósito: só roda
# quando algo dentro da pasta muda, e não mexe no pacote de deploy do site.
name: Nitro Crew

on:
  push:
    branches: [main]
    paths: ['nitro-crew/**', '.github/workflows/nitro-crew.yml']
  pull_request:
    branches: [main]
    paths: ['nitro-crew/**', '.github/workflows/nitro-crew.yml']
  workflow_dispatch:

jobs:
  testes:
    name: Typecheck + testes + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nitro-crew
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            nitro-crew/package-lock.json
            nitro-crew/server/package-lock.json
      - run: npm ci
      # O relay do online (server/relay.mjs) tem dependência própria (ws); o teste de integração
      # sobe o relay de verdade e, com NC_REQUIRE_RELAY=1, falha em vez de ser pulado sem o ws.
      - run: npm ci
        working-directory: nitro-crew/server
      - run: npm run typecheck
      - run: npm test
        env:
          NC_REQUIRE_RELAY: '1'
      - run: npx vite build
      - run: npm audit --audit-level=moderate
      - run: npm audit --audit-level=moderate
        working-directory: nitro-crew/server
