# Deploy do Padelizou pelo GitHub — serve pra publicar do celular.
#
# Este workflow não constrói nada: ele só entra no VPS por SSH e chama o
# /opt/padelizou-deploy/deploy.sh, o mesmo script de sempre. Quem monta o
# pacote continua sendo o ci.yml, e o deploy.sh só instala pacote vindo de
# release do CI — ou seja, publicar por aqui não abre nenhum atalho pra
# subir código que não passou nos testes.
#
# Como disparar do celular: app do GitHub → Actions → Deploy → Run workflow.
#
# Antes do primeiro uso é preciso criar os secrets e os environments.
# O passo a passo está em infra/vps/README.md.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Onde publicar"
        type: choice
        options: [dev, prod]
        default: dev
      acao:
        description: "Publicar uma versão ou voltar pra anterior"
        type: choice
        options: [deploy, rollback]
        default: deploy
      build:
        description: "Build específico (build-12-ab12cd3) ou sha do commit. Vazio = o mais recente."
        type: string
        default: ""

# Dois deploys no mesmo ambiente ao mesmo tempo deixariam o symlink e o
# .anterior inconsistentes. Sem cancel-in-progress: um deploy pela metade é
# pior que um deploy que esperou.
concurrency:
  group: deploy-${{ inputs.ambiente }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    name: ${{ inputs.acao }} → ${{ inputs.ambiente }}
    runs-on: ubuntu-latest

    # É daqui que sai a aprovação obrigatória do prod. A regra mora no
    # environment "prod" (Settings → Environments), não neste arquivo —
    # assim ninguém remove a trava mexendo no yml.
    environment: ${{ inputs.ambiente }}

    steps:
      # O build vira argumento de um comando remoto. Se viesse direto do
      # formulário pro shell, um valor com ; ou $( ) executaria no servidor.
      # Aqui ele passa por um formato fechado antes de chegar perto do ssh.
      - name: Conferir o build informado
        env:
          BUILD: ${{ inputs.build }}
        run: |
          if [ -n "$BUILD" ] && ! printf '%s' "$BUILD" | grep -Eq '^(build-[0-9]+-[0-9a-f]{7}|[0-9a-f]{7,40})$'; then
            echo "ERRO: '$BUILD' não parece um build (build-N-sha7) nem um sha de commit."
            exit 1
          fi

      # DESCOBRIR O BUILD AQUI, AUTENTICADO, e não na VPS (26/10/2026). O deploy do #387 em
      # dev ficou 10 min recebendo 403 e desistiu com o build já publicado: o deploy.sh
      # resolvia sha → build perguntando à API do GitHub SEM token, a cada 10 s, e a cota
      # anônima (60/hora por IP) acabou com dois deploys na mesma hora. Aqui o token é o do
      # próprio run (cota autenticada, separada da VPS), e o servidor recebe só o nome
      # build-N-sha7 — caminho em que o deploy.sh nem consulta a API. Token na linha do ssh,
      # não: ficaria visível na lista de processos do servidor.
      - name: Descobrir o build
        id: build
        if: inputs.acao == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILD: ${{ inputs.build }}
        run: |
          procurar() {
            gh api "repos/$REPO/releases?per_page=30" --jq '.[].tag_name' | grep -E "$1" | head -1 || true
          }

          if [ -z "$BUILD" ]; then
            TAG=$(procurar '^build-[0-9]+-[0-9a-f]{7}$')
          elif [[ "$BUILD" == build-* ]]; then
            TAG="$BUILD"
          else
            # Recebeu um sha: espera o CI gerar o build dele (até 10 min), como o deploy.sh fazia.
            SHA7="${BUILD:0:7}"
            for i in $(seq 1 60); do
              TAG=$(procurar "^build-[0-9]+-${SHA7}\$")
              [ -n "$TAG" ] && break
              echo "  aguardando o CI gerar o build do commit $SHA7... ($i/60)"
              sleep 10
            done
          fi

          # Vira argumento de comando remoto: só entra se for exatamente build-N-sha7.
          if ! printf '%s' "$TAG" | grep -Eq '^build-[0-9]+-[0-9a-f]{7}$'; then
            echo "ERRO: não encontrei build pra '${BUILD:-o mais recente}'. O CI passou?"
            exit 1
          fi
          echo "==> Build: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Preparar o acesso ao VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # A chave pública do SERVIDOR — a que faz o ssh saber que está falando com o
          # VPS certo, e não com quem se passa por ele.
          #
          # Com o secret VPS_KNOWN_HOSTS ela é FIXA: o valor foi lido de dentro do
          # servidor uma vez, e daí em diante qualquer divergência derruba a conexão. É o
          # jeito mais seguro e continua sendo o preferido.
          #
          # Sem o secret, buscamos na hora. Isso confia no primeiro contato em vez de
          # conferir contra algo sabido — mais fraco, e é o padrão da maioria dos deploys
          # por CI. A troca é deliberada: pegar a chave do servidor exigia ENTRAR nele, e
          # esse era o único passo da configuração que não dava pra fazer do computador.
          # Um deploy configurado com TOFU protege mais que um pino que ninguém chegou a
          # configurar.
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS não está definido — buscando a chave do servidor na hora (menos rígido). Defina o secret pra fixá-la."
            ssh-keyscan -t ed25519,rsa "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "ERRO: não consegui a chave pública do servidor. Confira o secret VPS_HOST."
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: ${{ inputs.acao == 'rollback' && 'Voltar pra versão anterior' || 'Publicar' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || 'root' }}
          AMBIENTE: ${{ inputs.ambiente }}
          ACAO: ${{ inputs.acao }}
          # O build JÁ RESOLVIDO no passo acima — nunca o input cru: com sha, a VPS voltaria a
          # perguntar à API sem token.
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          if [ "$ACAO" = "rollback" ]; then
            COMANDO="/opt/padelizou-deploy/rollback.sh $AMBIENTE"
          else
            COMANDO="/opt/padelizou-deploy/deploy.sh $AMBIENTE $TAG"
          fi

          # -tt não: sem tty o log sai limpo e o exit code do script remoto
          # chega inteiro aqui, que é o que faz o job ficar vermelho quando o
          # healthcheck falha e o deploy.sh dá rollback sozinho.
          ssh -i ~/.ssh/id_deploy \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" "$COMANDO"

      # O resumo aparece na tela do run — no celular é o que você lê sem
      # precisar abrir o log inteiro.
      - name: Resumo
        if: always()
        env:
          AMBIENTE: ${{ inputs.ambiente }}
          ACAO: ${{ inputs.acao }}
          BUILD: ${{ inputs.build }}
          RESULTADO: ${{ job.status }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          {
            echo "## $ACAO em $AMBIENTE — $RESULTADO"
            echo ""
            echo "- Build pedido: \`${BUILD:-o mais recente}\`"
            if [ -n "$TAG" ]; then echo "- Build instalado: \`$TAG\`"; fi
            echo "- Disparado por: @${{ github.actor }}"
            if [ "$AMBIENTE" = "prod" ]; then
              echo "- Site: https://padelizou.com.br/healthz"
            else
              echo "- Site: https://dev.padelizou.com.br/healthz"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
