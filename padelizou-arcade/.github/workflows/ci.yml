name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sem package-lock, sem npm install: o jogo não tem UMA dependência. O node do runner basta.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version
      - run: npm test
